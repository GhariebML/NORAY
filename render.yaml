services:
  - type: web
    name: noray-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn noray.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://noray-frontend.vercel.app,http://localhost:3000
