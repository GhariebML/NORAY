[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NORAY"
version = "1.0.0"
description = "NORAY — AI Career & Scholarship Operating System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.12.0",
    "structlog>=23.2.0",
    "pdfplumber>=0.10.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "sqlalchemy>=2.0.0",
    "qdrant-client>=1.7.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.2",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
]

[project.optional-dependencies]
full = [
    "pymupdf>=1.23.0",
    "python-docx>=1.0.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["NORAY*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["NORAY"]

[tool.ruff.format]
quote-style = "single"
