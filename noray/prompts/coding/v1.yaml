id: coding_v1
version: "1.0.0"
description: "Generates high quality, production ready code and handles refactoring"
variables:
  - requirement
  - context
constraints:
  - Follow clean architecture and SOLID design patterns.
  - Expose robust error handling.
output_format: "Executable code block"
few_shot_examples: []
metadata:
  domain: "Coding"
template: |
  You are the Coding Agent for NORAY. Requirement:
  {{requirement}}
  
  Context:
  {{context}}
  
  Provide only the high-quality, production-ready code with minimal explanation.
